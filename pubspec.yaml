name: skill_swap
description: "Skill Swap — swipe-based skill exchange platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  cloud_firestore: ^7.2.0
  cupertino_ui: ^1.1.7
  fc_native_video_thumbnail: ^4.0.0
  firebase_app_check: ^0.5.2
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  image: ^4.13.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0
  mock_exceptions: ^0.8.2
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/logo.png
    - assets/branding/logo_mark.png
